name: Build Minecraft Connector

on:
  push:
    branches:
      - minecraft-connecter
    paths:
      - "minecart-connector/**"
      - ".github/workflows/build-minecart-connector.yml"
  pull_request:
    branches:
      - minecraft-connecter
    paths:
      - "minecart-connector/**"
      - ".github/workflows/build-minecart-connector.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Build plugin
        working-directory: minecart-connector
        run: gradle build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftConnector-1.0.0
          path: minecart-connector/build/libs/MinecraftConnector-1.0.0.jar
          if-no-files-found: error
