name: CustomEnchants
version: 2.1.0
main: net.example.customenchants.CustomEnchants
api-version: '26.3'
description: Three XP-purchased utility enchantments for Paper.
commands:
  enchantshop:
    description: Open the enchant shop or manage custom enchant books.
    usage: /enchantshop [apply <lumberjack|veinminer|3x3miner> | give <player> <enchant>]
    aliases: [eshop]
  enchantadmin:
    description: Open the CustomEnchants admin settings menu.
    permission: customenchants.admin
    usage: /enchantadmin
permissions:
  customenchants.shop:
    description: Open and purchase from the enchant shop.
    default: true
  customenchants.use:
    description: Use custom enchantments.
    default: true
  customenchants.admin:
    description: Manage CustomEnchants and give custom enchant books.
    default: op
  customenchants.tpa:
    description: Use this plugin's TPA commands.
    default: true

