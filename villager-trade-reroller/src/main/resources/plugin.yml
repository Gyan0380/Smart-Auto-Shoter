name: VillagerTradeReroller
version: 1.1.0
main: net.gyan0380.villagertradereroller.VillagerTradeReroller
api-version: '26.1'
description: Select and confirm current trades for any villager profession, then reroll the selected result.
author: Gyan0380
commands:
  traderoll:
    description: Select a villager and choose a trade result to reroll for.
    usage: /traderoll [select|stop]
    aliases: [vtr]
permissions:
  tradereroller.use:
    description: Use the villager trade reroller.
    default: true
  tradereroller.admin:
    description: Change reroller settings.
    default: op
