name: MinecartConnector
version: 1.0.0
main: net.gyan0380.minecartconnector.MinecraftConnector
api-version: '1.21'
description: Connect minecarts into small trains using a chain.
author: Gyan0380
commands:
  minecartconnector:
    description: Minecart Connector help and configuration reload.
    usage: /minecartconnector [help|reload]
    aliases: [mccarts, mconnector]
permissions:
  minecartconnector.admin:
    description: Reload Minecart Connector settings.
    default: op
