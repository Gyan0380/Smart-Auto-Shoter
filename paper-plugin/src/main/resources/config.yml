# Prices are charged in XP levels.
prices:
  lumberjack: 10
  veinminer: 20
  3x3miner: 30
  longarm: 15
  lessdamage: 40
  healer: 25

# Each additional custom enchantment on the same tool adds additional-cost levels.
# Example defaults: first enchant costs 2, second 4, third 6 levels.
application:
  base-cost: 2
  additional-cost: 2
  max-per-tool: 6

shop:
  enabled: true
  items:
    lumberjack:
      enabled: true
    veinminer:
      enabled: true
    3x3miner:
      enabled: true
    longarm:
      enabled: true
    lessdamage:
      enabled: true
    healer:
      enabled: true

# The admin menu can block /nightvision for all players.
nightvision:
  enabled: true

# TPA commands are registered as aliases only when not already claimed by another plugin.
tpa:
  enabled: true
  request-timeout-seconds: 60
  warmup-seconds: 5
  cooldown-seconds: 5
  cancel-on-move: true
  play-sound: true
  sound: ENTITY_ENDERMAN_TELEPORT

# Maximum blocks affected per trigger, including the first block.
limits:
  lumberjack: 128
  veinminer: 64

# Range around connected logs in which matching leaves are collected.
lumberjack:
  leaf-radius: 6


# Long Arm mining reach bonus applies while holding an enchanted item in the main hand.
long-arm:
  block-range-bonus: 2.0

# Chance values are 0.0-1.0. Durability reduction applies when damage is not negated.
less-damage:
  prevent-chance: 0.45
  reduction: 0.25
  repair-chance: 0.05

# XP points (not levels) spent per 1 durability restored by sneaking + right-clicking.
healer:
  xp-per-durability: 1.5
