# Maximum number of links allowed per cart. 2 allows a cart to sit in a train.
max-links-per-cart: 2

# Desired distance between connected carts, in blocks.
target-distance: 1.35

# How strongly linked carts pull toward their target distance.
# Keep this modest so carts can still move naturally on rails.
spring-strength: 0.08

# Maximum correction applied to a cart's horizontal velocity each tick.
max-velocity-correction: 0.08

# Item used to connect carts.
connector-item: CHAIN
